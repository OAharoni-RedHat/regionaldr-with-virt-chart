---
# Always runs after PostSync settlement (wave 13) — including drpartner-minimal
# (resourcesEnabled and infrastructureEnabled both false). When resourcesEnabled,
# wave 12 DRPC health must succeed first. Disables Application automated sync
# once Sync resources have settled.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-sync-disable
  namespace: open-cluster-management
  labels:
    app.kubernetes.io/name: argocd-sync-disable
    app.kubernetes.io/component: argocd-sync-control
  annotations:
    argocd.argoproj.io/sync-wave: "13"
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/hook: "PostSync"
    argocd.argoproj.io/hook-delete-policy: "BeforeHookCreation"
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        {{- include "rdr.ansibleJobPodAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: argocd-sync-disable
      restartPolicy: Never
      containers:
      - name: argocd-sync-disable
        image: {{ $.Values.ansible.containerImage }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        command:
        - /bin/bash
        - -c
        - |
{{ include "rdr.ansibleBootstrap" . | indent 10 }}
            ansible-playbook -i inventory/hosts playbooks/argocd_sync_disable.yml \
              -e "argocd_app_name=${ARGOCD_APP_NAME:-regional-dr}" \
              -e "argocd_app_namespace=${ARGOCD_APP_NAMESPACE}"
        volumeMounts:
        - name: ansible
          mountPath: /ansible-cm
          readOnly: true
        env:
        - name: ARGOCD_APP_NAME
          value: "regional-dr"
        - name: ARGOCD_APP_NAMESPACE
          value: {{ printf "%s-%s" (.Values.global.pattern | default "ramendr-starter-kit-hub") (index (.Values.main | default dict) "clusterGroupName" | default "resilient") | quote }}
        - name: KUBECONFIG
          value: ""
      volumes:
      - name: ansible
        configMap:
          name: rdr-ansible
