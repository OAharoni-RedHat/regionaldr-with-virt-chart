{{- /* Hub DRCluster CRs when create=true (MirrorPeer/MCO not owning them). Independent of ramen.resourcesEnabled. */}}
{{- if eq "1" (include "rdr.drClusterCreate" . | trim) }}
{{- $primary := include "rdr.primaryClusterName" . }}
{{- $secondary := include "rdr.secondaryClusterName" . }}
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: {{ $primary }}
  labels:
    cluster.open-cluster-management.io/backup: ramen
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  s3ProfileName: {{ include "rdr.drClusterPrimaryS3ProfileName" . | quote }}
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: {{ $secondary }}
  labels:
    cluster.open-cluster-management.io/backup: ramen
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  s3ProfileName: {{ include "rdr.drClusterSecondaryS3ProfileName" . | quote }}
{{- end }}
