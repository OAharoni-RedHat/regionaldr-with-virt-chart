{{- $primary := .Values.global.primaryClusterName }}
{{- $secondary := .Values.global.secondaryClusterName }}
{{- $clusterSet := .Values.global.clusterSetName | default "resilient" }}
{{- $globalnetEnabled := false }}
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: {{ $clusterSet }}-broker
---
apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: submariner-broker
  namespace: {{ $clusterSet }}-broker
  labels:
    cluster.open-cluster-management.io/backup: submariner
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  globalnetEnabled: {{ $globalnetEnabled }}

{{- $awsPlat := eq "aws" (lower (.Values.global.clusterPlatform | default "AWS")) }}
{{- range list $primary $secondary }}
{{- $cluster := . }}
---
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ManagedClusterAddOn
metadata:
  name: submariner
  namespace: {{ $cluster }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  installNamespace: submariner-operator
---
apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
kind: SubmarinerConfig
metadata:
  name: submariner
  namespace: {{ $cluster }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gatewayConfig:
    gateways: 1
{{- if $awsPlat }}
    aws:
      instanceType: {{ $.Values.submariner.instanceType }}
{{- end }}
  cableDriver: {{ $.Values.submariner.cableDriver }}
{{- if $awsPlat }}
  credentialsSecret:
    name: {{ $cluster }}-cluster-aws-creds
{{- end }}
{{- end }}
