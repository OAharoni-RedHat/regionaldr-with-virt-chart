{{- if eq "1" (include "rdr.ramenResourcesEnabled" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drpc-health-check
  namespace: open-cluster-management
  labels:
    app.kubernetes.io/name: drpc-health-check
    app.kubernetes.io/component: health-check
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drpc-health-check
  labels:
    app.kubernetes.io/name: drpc-health-check
    app.kubernetes.io/component: health-check
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
# Permissions for DRPC (check + delete when recipe reconciliation is stuck)
- apiGroups: ["ramendr.openshift.io"]
  resources: ["drplacementcontrols"]
  verbs: ["get", "list", "delete"]
# Permissions for checking PVCs
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
# Permissions for checking Kubernetes objects in protected namespaces
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list"]
# Hard-refresh annotation on Application during recipe-failure recovery
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drpc-health-check
  labels:
    app.kubernetes.io/name: drpc-health-check
    app.kubernetes.io/component: health-check
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: drpc-health-check
subjects:
- kind: ServiceAccount
  name: drpc-health-check
  namespace: open-cluster-management
{{- end }}
