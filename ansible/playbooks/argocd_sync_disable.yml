---
# One-time disable of Argo CD automated sync on the regional-dr Application after
# PostSync settlement, plus hub ignoreDifferences so parent selfHeal cannot
# re-enable automated sync from git (independent of DRPC health / managed workloads).
- name: Disable Argo CD automated sync
  hosts: localhost
  gather_facts: false
  roles:
    - argocd_sync_disable
