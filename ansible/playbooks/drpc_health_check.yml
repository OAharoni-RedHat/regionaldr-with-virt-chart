---
# DRPC health validation (retry loop). Does not disable Argo CD sync — see
# playbooks/argocd_sync_disable.yml (separate PostSync Job, later wave).
#
# If DRPC phase is not in drpc_healthy_phases (Deployed, FailedOver, Relocated by default), status JSON
# contains drpc_recipe_failure_phrase (default: "recipe reconcile failed"), and the object is at most
# drpc_recipe_failure_max_age_minutes old (default 15), the role deletes the DRPC, waits until it is gone,
# annotates the Argo CD Application for hard refresh (not an operation sync), and retries on the next attempt.
- name: DRPC health check
  hosts: localhost
  gather_facts: false
  roles:
    - drpc_health_check
